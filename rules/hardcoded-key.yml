rules:
  - id: hardcoded-api-key
    languages: [python]
    severity: ERROR
    message: "Segredo hardcoded. Use os.environ ou um cofre de segredos."
    metadata:
      cwe: "CWE-798"
    patterns:
      - pattern: $VAR = $VALUE
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(api_?key|secret|token|passw(or)?d).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^["'](?=.*\d).{8,}["']$